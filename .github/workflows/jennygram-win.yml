name: Jennygram Windows.

# 제니그램 윈도우 x64 릴리스 빌드.
# 의존 라이브러리 준비가 한 번의 작업 시간(6시간) 안에 끝나지 않을 수 있어
# 진행분을 캐시에 저장하고 스스로 다시 실행해 이어 간다(최대 4회).

on:
  push:
    branches:
      - jennygram
      - jennygram-internal
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      attempt:
        description: '이어 하기 회차'
        required: false
        default: '1'

permissions:
  contents: read
  actions: write

concurrency:
  group: jennygram-win-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      ATTEMPT: ${{ github.event.inputs.attempt || '1' }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Clean up preinstalled software.
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Get-Service docker -ErrorAction SilentlyContinue | Stop-Service -ErrorAction SilentlyContinue
          wsl --shutdown 2> $null
          Remove-Item "C:\Android\android-sdk", "C:\Program Files\dotnet", "C:\Miniconda", "C:\msys64", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\Docker", "C:\ProgramData\DockerDesktop", "C:\Program Files\PostgreSQL", "C:\PostgreSQL", "C:\Program Files\MongoDB", "C:\Program Files\MySQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup", "C:\cabal", "C:\Program Files\LLVM", "C:\vcpkg", "C:\tools\kotlinc", "C:\tools\php", "C:\tools\Apache24", "C:\tools\nginx-*", "C:\selenium", "C:\SeleniumWebDrivers", "C:\Program Files\R", "C:\Program Files (x86)\R", "C:\rtools*", "C:\Program Files\Google\Chrome*", "C:\Program Files (x86)\Google\Chrome*", "C:\Program Files\Mozilla Firefox*", "C:\ProgramData\Package Cache" -Recurse -Force -ErrorAction SilentlyContinue
          # The _Instances registry is how vswhere finds Visual Studio.
          Get-ChildItem "C:\ProgramData\Microsoft\VisualStudio\Packages" -Exclude _Instances -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item C:\hostedtoolcache\windows\Go*, C:\hostedtoolcache\windows\Ruby*, C:\hostedtoolcache\windows\PyPy*, C:\hostedtoolcache\windows\Java_*, C:\hostedtoolcache\windows\NuGet* -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ('{0:N1} GB -> {1:N1} GB free' -f $before, ((Get-PSDrive C).Free / 1GB))
          exit 0

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache restore.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-jg-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.OS }}-jg-third-party-${{ env.CACHE_KEY }}-

      - name: Libraries cache restore.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-jg-x64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.OS }}-jg-x64-libs-${{ env.CACHE_KEY }}-

      - name: Libraries state before.
        shell: bash
        run: |
          mkdir -p "$LibrariesPath"
          STATE="$({ find "$LibrariesPath" "$TBUILD/ThirdParty" -path '*cache_keys*' -type f -print0 2>/dev/null || true; } | sort -z | xargs -0 -r sha256sum | sha256sum | awk '{ print $1 }')"
          echo "LIBS_STATE_BEFORE=$STATE" >> $GITHUB_ENV
          echo "stages before: $({ find "$LibrariesPath" -path '*cache_keys*' -type f 2>/dev/null || true; } | wc -l)"

      - name: Libraries.
        id: libs
        continue-on-error: true
        timeout-minutes: 285
        run: |
          set CARGO_INCREMENTAL=0
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' ')' -type f ')' -o -empty ')' -delete

      - name: Libraries state after.
        if: always()
        shell: bash
        run: |
          mkdir -p "$LibrariesPath"
          STATE="$({ find "$LibrariesPath" "$TBUILD/ThirdParty" -path '*cache_keys*' -type f -print0 2>/dev/null || true; } | sort -z | xargs -0 -r sha256sum | sha256sum | awk '{ print $1 }')"
          echo "stages after: $({ find "$LibrariesPath" -path '*cache_keys*' -type f 2>/dev/null || true; } | wc -l)"
          if [ "$STATE" != "$LIBS_STATE_BEFORE" ]; then
            echo "LIBS_CHANGED=true" >> $GITHUB_ENV
          else
            echo "LIBS_CHANGED=false" >> $GITHUB_ENV
          fi
          du -sh "$LibrariesPath" "$TBUILD/ThirdParty" 2>/dev/null || true

      - name: ThirdParty cache save.
        if: always() && env.LIBS_CHANGED == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-jg-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Libraries cache save.
        if: always() && env.LIBS_CHANGED == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-jg-x64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Continue in a new run.
        if: steps.libs.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LIBS_CHANGED" != "true" ]; then
            echo "Libraries failed without any progress."
            exit 1
          fi
          if [ "$ATTEMPT" -ge 4 ]; then
            echo "Libraries are not ready after $ATTEMPT attempts."
            exit 1
          fi
          gh workflow run jennygram-win.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f attempt=$((ATTEMPT + 1))
          echo "Libraries are not ready yet, continued in a new run."
          exit 1

      - name: Configure pagefile.
        if: steps.libs.outcome == 'success'
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 20GB
          disk-root: "C:"

      - name: Jennygram build.
        if: steps.libs.outcome == 'success'
        run: |
          setlocal EnableDelayedExpansion
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} ^
          -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if %errorlevel% neq 0 exit /b %errorlevel%

          cmake --build ..\out --config Release --parallel
          set BUILD_RC=%errorlevel%
          if %BUILD_RC% neq 0 (
            echo First pass failed, retrying the remaining files with two compilers.
            cmake --build ..\out --config Release -- /m:1 /p:CL_MPCount=2
            set BUILD_RC=!errorlevel!
          )
          if %BUILD_RC% neq 0 (
            echo Second pass failed, retrying the remaining files with one compiler.
            cmake --build ..\out --config Release -- /m:1 /p:CL_MPCount=1
            set BUILD_RC=!errorlevel!
          )
          powershell -NoProfile -Command "Write-Host ('{0:N1} GB free after build' -f ((Get-PSDrive C).Free / 1GB))"
          exit /b %BUILD_RC%

      - name: Move artifact.
        if: steps.libs.outcome == 'success'
        shell: bash
        run: |
          OUT="$TBUILD/$REPO_NAME/out/Release"
          ls -la "$OUT" || true
          mkdir artifact
          find "$OUT" -maxdepth 2 -name '*.exe' -exec cp -v {} artifact/ \;
          if [ -d "$OUT/modules" ]; then cp -rv "$OUT/modules" artifact/; fi
          ls -la artifact
          test -n "$(ls artifact/*.exe 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        if: steps.libs.outcome == 'success'
        with:
          name: Jennygram-win-x64
          path: artifact\
          retention-days: 30
